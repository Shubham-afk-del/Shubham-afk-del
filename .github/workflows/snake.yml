name: snake

# Redraws the contribution snake onto the output branch, which the README reads.
on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#121211&color_dots=#ebe7df,#f6cdb9,#ec9e7c,#e06d43,#d43d0a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ededec&color_dots=#1c1c20,#4a1f10,#8a3414,#cc4a1b,#ff5a1f

      - name: publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Redraw the contribution snake"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ github.token }}
